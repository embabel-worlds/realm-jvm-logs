# Questions answered from logs and stack traces, read to the code. No view names a library or an
# application: what a trace touches is whatever the jars under data/jars compiled.

- name: JvmStackTraceCode
  description: >-
    The offending code for a Java stack trace: each throwable in it (thrown, causes, suppressed),
    with every frame in a jar under data/jars, the method's whole declaration and the lines it was
    on. `offending` marks each throwable's first frame in a jar - read those first.
  params:
    trace: { type: string, description: "The stack trace, as printed." }
  cypher: |
    MATCH (t:StackTrace {text: $trace})-[:HAS_FRAME]->(f:JavaStackFrame {inJar: true})
    OPTIONAL MATCH (f)-[:SOURCE_AT]->(s:SourceSpan)
    OPTIONAL MATCH (f)-[:DECLARED_AT]->(d:JavaDeclaration)
    RETURN f.exceptionIndex AS exceptionIndex, f.relation AS relation, f.depth AS depth, f.exception AS exception, f.frame AS frame,
           f.firstInJar AS offending, f.className + '.' + f.method AS method, f.line AS line,
           d.matches AS sourceMatches, s.text AS lines, d.signature AS declaration, d.fromLine AS fromLine,
           d.toLine AS toLine, d.text AS code, f.jarPath AS jar
    ORDER BY exceptionIndex, frame

- name: JvmStackTraceSummary
  description: >-
    What a Java stack trace says, throwable by throwable: the exception and its message, whether it
    is the root cause, where it was thrown, and the first frame in a jar under data/jars with the
    lines around it.
  params:
    trace: { type: string, description: "The stack trace, as printed." }
  cypher: |
    MATCH (t:StackTrace {text: $trace})-[:HAS_EXCEPTION]->(x:JavaThrowable)
    OPTIONAL MATCH (x)-[:SOURCE_AT]->(s:SourceSpan)
    OPTIONAL MATCH (x)-[:DECLARED_AT]->(d:JavaDeclaration)
    RETURN x.index AS index, x.relation AS relation, x.depth AS depth, x.parentIndex AS of, x.exception AS exception,
           x.message AS message, x.isRootCause AS rootCause, x.topFrame AS thrownAt, x.jarFrame AS inYourCode,
           x.jarFrameLine AS line, x.frameCount AS frames, x.elided AS elided, d.signature AS inMethod,
           d.matches AS sourceMatches, s.text AS code
    ORDER BY index

- name: JvmLogFailures
  description: >-
    The failures the logs recorded, grouped by fingerprint (same exception, same root cause, same
    frames): how often each happened, first and last seen, the loggers that reported it and where
    in the logs. The most frequent first.
  params:
    limit: { type: int, default: 25, description: "Maximum failures." }
  cypher: |
    MATCH (me:AssistantUser)-[:HAS_LOG_EVENT]->(e:LogEvent {hasTrace: true})
    WITH e.fingerprint AS fingerprint, e.exception AS exception, e.rootCause AS rootCause,
         count(*) AS occurrences, min(e.timestamp) AS firstSeen, max(e.timestamp) AS lastSeen,
         collect(DISTINCT e.logger) AS loggers, collect(e.path + ':' + toString(e.line)) AS at
    RETURN fingerprint, exception, rootCause, occurrences, firstSeen, lastSeen, loggers, at[0..5] AS where
    ORDER BY occurrences DESC, lastSeen DESC
    LIMIT $limit

- name: JvmLogFailureCode
  description: >-
    The code behind the failures in the logs: for each logged exception (or the one fingerprint
    asked for), the root cause, the first frame of it in a jar under data/jars, and the lines there.
  params:
    fingerprint: { type: string, default: "", description: "One failure's fingerprint (from JvmLogFailures); empty = every logged failure." }
    limit: { type: int, default: 25, description: "Maximum events." }
  cypher: |
    MATCH (me:AssistantUser)-[:HAS_LOG_EVENT]->(e:LogEvent {hasTrace: true})
    WHERE $fingerprint = '' OR e.fingerprint = $fingerprint
    MATCH (e)-[:HAS_EXCEPTION]->(x:JavaThrowable {isRootCause: true})
    OPTIONAL MATCH (x)-[:SOURCE_AT]->(s:SourceSpan)
    OPTIONAL MATCH (x)-[:DECLARED_AT]->(d:JavaDeclaration)
    RETURN e.timestamp AS at, e.path + ':' + toString(e.line) AS logLine, e.logger AS logger, e.message AS logged,
           x.exception AS rootCause, x.message AS message, x.jarFrame AS inYourCode, x.jarFrameLine AS line,
           d.signature AS inMethod, d.matches AS sourceMatches, s.text AS code, e.fingerprint AS fingerprint
    ORDER BY at DESC
    LIMIT $limit

- name: JvmLogLevels
  description: >-
    The logs by severity and logger: how many events each logger wrote at each level, and how many
    carried a stack trace - where the noise and the failures come from.
  cypher: |
    MATCH (me:AssistantUser)-[:HAS_LOG_EVENT]->(e:LogEvent)
    RETURN e.severity AS severity, e.logger AS logger, count(*) AS events,
           sum(CASE WHEN e.hasTrace THEN 1 ELSE 0 END) AS withTrace, max(e.timestamp) AS last
    ORDER BY events DESC

# Failures read against the whole jar: the call graph, every throw site and the shape of the
# methods that failed. Each starts from the logs, so it answers for the failures actually seen.

- name: JvmFailureCallers
  description: >-
    Who else calls the methods that failed: for each logged failure, the method its first frame in a
    jar was in, every call to it from the jar's code, and whether the failure came through that
    caller (`onFailingPath`) - the other callers are paths that have not failed yet. The method is the
    one whose line table holds the failing line (RAN_IN), so overloads and constructors resolve exactly.
  cypher: |
    MATCH (me:AssistantUser)-[:HAS_LOG_EVENT]->(e:LogEvent {hasTrace: true})-[:HAS_FRAME]->(f:JavaStackFrame {firstInJar: true, depth: 0})
    MATCH (f)-[:RAN_IN]->(m:JavaMethod)
    MATCH (e)-[:HAS_FRAME]->(tf:JavaStackFrame {depth: 0})
    WITH e, f, m, collect(tf.className + '.' + tf.method) AS path
    MATCH (m)-[:CALLED_BY]->(c:JavaMethodCall)
    OPTIONAL MATCH (c)-[:AT_SITE]->(site:JavaCallSite)
    RETURN DISTINCT f.exception AS exception, f.className + '.' + f.method AS failed, f.line AS failedLine, m.key AS method,
           split(c.caller, '(')[0] AS caller, c.firstLine AS callLine, split(c.caller, '(')[0] IN path AS onFailingPath,
           site.text AS call, c.sourceKey AS source
    ORDER BY failed, onFailingPath DESC, caller

- name: JvmThrowSiteCoverage
  description: >-
    How much of a failure the logs have seen: for each exception the logs name as a root cause, how
    many places in the jar construct it and at how many of those the logs show it failing. A large
    gap is code that throws the same way and has not been seen to.
  params:
    jar: { type: string, description: "The application's jar under data/, e.g. `jars/app-1.0.jar`." }
  cypher: |
    MATCH (me:AssistantUser)-[:HAS_LOG_EVENT]->(e:LogEvent {hasTrace: true})-[:HAS_FRAME]->(f:JavaStackFrame {inJar: true})
    WITH collect(DISTINCT f.className + ':' + toString(f.line)) AS seen, collect(DISTINCT e.rootCause) AS causes
    UNWIND causes AS cause
    MATCH (j:Jar {path: $jar})-[:HAS_CALL]->(c:JavaMethodCall {calleeName: '<init>'}) WHERE c.calleeOwner = cause
    WITH cause, c, any(l IN c.lines WHERE c.callerOwner + ':' + toString(l) IN seen) AS seenFailing
    RETURN cause AS exception, count(*) AS throwSites, sum(CASE WHEN seenFailing THEN 1 ELSE 0 END) AS seenFailing,
           collect(CASE WHEN seenFailing THEN split(c.caller, '(')[0] END) AS failedIn
    ORDER BY throwSites DESC

- name: JvmUnseenThrowSites
  description: >-
    Every place the jar constructs one exception, with the message it would carry as written, and
    whether the logs have seen it fail there - the ones not seen are where the same failure is
    still waiting.
  params:
    jar: { type: string, description: "The application's jar under data/." }
    exception: { type: string, description: "Binary name of the exception, e.g. `java.lang.IllegalStateException` (from JvmThrowSiteCoverage)." }
    limit: { type: int, default: 50, description: "Maximum sites." }
  cypher: |
    MATCH (me:AssistantUser)-[:HAS_LOG_EVENT]->(e:LogEvent {hasTrace: true})-[:HAS_FRAME]->(f:JavaStackFrame {inJar: true})
    WITH collect(DISTINCT f.className + ':' + toString(f.line)) AS seen
    MATCH (j:Jar {path: $jar})-[:HAS_CALL]->(c:JavaMethodCall {calleeOwner: $exception, calleeName: '<init>'})
    OPTIONAL MATCH (c)-[:AT_SITE]->(site:JavaCallSite)
    WITH c, site, any(l IN c.lines WHERE c.callerOwner + ':' + toString(l) IN seen) AS seenFailing
    RETURN seenFailing, split(c.caller, '(')[0] AS method, c.lines AS lines, site.arguments AS message, site.url AS url, c.sourceKey AS source
    ORDER BY seenFailing DESC, method
    LIMIT $limit

- name: JvmFailureLocals
  description: >-
    The locals declared in each failing method before the failing line, with their types as written
    and what they were given - the values to log or inspect next time. Declared before the line is
    not proof of being in scope there: a block or pattern variable may have ended.
  cypher: |
    MATCH (me:AssistantUser)-[:HAS_LOG_EVENT]->(e:LogEvent {hasTrace: true})-[:HAS_FRAME]->(f:JavaStackFrame {firstInJar: true})
    MATCH (f)-[:HAS_LOCAL]->(l:JavaLocal) WHERE l.line <= f.line
    WITH DISTINCT f.exception AS exception, f.className + '.' + f.method AS failed, f.line AS failedLine,
         l.line AS line, l.kind AS kind, l.declaredType AS type, l.name AS name, l.initializer AS initializer
    RETURN exception, failed, failedLine, line, kind, type, name, initializer
    ORDER BY failed, line

- name: JvmFailingMethodShape
  description: >-
    The shape of each method a logged failure ran through in the jar: its length in lines, the calls
    it makes, the field reads and writes, and its locals - whether failures sit in the long, busy
    methods. `sourceMatches` false means the source read is not the jar's version.
  cypher: |
    MATCH (me:AssistantUser)-[:HAS_LOG_EVENT]->(e:LogEvent {hasTrace: true})-[:HAS_FRAME]->(f:JavaStackFrame {inJar: true, depth: 0})
    MATCH (f)-[:RAN_IN]->(m:JavaMethod)
    OPTIONAL MATCH (f)-[:DECLARED_AT]->(d:JavaDeclaration)
    OPTIONAL MATCH (m)-[:MAKES_CALL]->(c:JavaMethodCall)
    WITH f, m, d, count(DISTINCT c) AS calls
    OPTIONAL MATCH (m)-[:MAKES_ACCESS]->(a:JavaFieldAccess)
    WITH f, m, d, calls, count(DISTINCT a) AS fieldAccesses
    OPTIONAL MATCH (f)-[:HAS_LOCAL]->(l:JavaLocal)
    WITH m, d, calls, fieldAccesses, count(DISTINCT l) AS locals, collect(DISTINCT f.exception) AS exceptions
    RETURN m.key AS method, d.toLine - d.fromLine + 1 AS lines, calls, fieldAccesses, locals, exceptions, d.matches AS sourceMatches
    ORDER BY lines DESC
